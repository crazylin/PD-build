name: Prune TalkyTimes R2 versions

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Versions to delete from R2 (comma/space separated, e.g. "0.1.1 0.1.2")
        required: true
        type: string

permissions:
  contents: read

jobs:
  prune:
    name: Prune old R2 versions
    runs-on: ubuntu-22.04
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PD_CLONE_SSH_KEY }}
      - name: Clone private PD (prune script)
        env:
          GH_PAT: ${{ secrets.PD_CLONE_PAT }}
        run: |
          set -euo pipefail
          set +x
          if ssh-add -l >/dev/null 2>&1; then
            GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=yes' \
              git clone --depth 1 --branch main git@github.com:crazylin/TalkyTimes.git talkytimes-src
          elif [ -n "${GH_PAT:-}" ]; then
            git clone --depth 1 --branch main "https://x-access-token:${GH_PAT}@github.com/crazylin/TalkyTimes.git" talkytimes-src
          else
            echo "PD_CLONE_SSH_KEY or PD_CLONE_PAT secret is required" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Delete known objects for the given versions
        working-directory: talkytimes-src
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PRUNE_VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          set +x
          node scripts/prune-r2-versions.mjs
